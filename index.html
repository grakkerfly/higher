<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ff41">
  <title>MY PRONOUNS ARE HIGH/ER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="portal" class="portal" role="button" tabindex="0" aria-label="Enter HIGHER">
    <div class="portal-static"></div>
    <img src="assets/heman1.gif" alt="Enter HIGHER" class="portal-heman" draggable="false">
    <div class="portal-cursor">CLICK TO ENTER</div>
  </div>

  <main id="site" class="site" aria-hidden="true">
    <video id="backgroundVideo" class="background-video" autoplay muted loop playsinline>
      <source src="assets/higher.mp4" type="video/mp4">
    </video>
    <audio id="backgroundAudio" src="assets/higher.mp3" loop preload="auto"></audio>

    <div class="screen-flash"></div>
    <div class="noise"></div>
    <div id="cursorTrail" class="cursor-trail"></div>

    <div class="gifbar gifbar-top" aria-hidden="true"></div>

    <div class="global-chaos" aria-hidden="true">
      <img src="assets/storm.gif" class="global-effect global-storm" alt="">
      <img src="assets/thunder1.gif" class="global-effect global-thunder-one" alt="">
      <img src="assets/thunder2.gif" class="global-effect global-thunder-two" alt="">
      <img src="assets/money.gif" class="global-effect global-money" alt="">
    </div>

    <nav class="chaos-nav" aria-label="Project links">
      <a id="twitterButton" class="glitch-button" href="#" target="_blank" rel="noopener">X.COM</a>
      <a id="pumpButton" class="glitch-button" href="#" target="_blank" rel="noopener">PUMP.FUN</a>
      <button id="contractButton" class="glitch-button" type="button">COPY CONTRACT</button>
      <button id="soundButton" class="glitch-button sound-button" type="button">SOUND: ON</button>
    </nav>

    <section class="hero" aria-label="HIGHER">
      <div id="stormLayer" class="storm-layer" aria-hidden="true"></div>
      <img src="assets/logo.png" class="main-logo" alt="HIGHER" draggable="false">
      <div id="hemanLayer" class="heman-layer" aria-hidden="true"></div>
      <div id="moneyLayer" class="money-layer" aria-hidden="true"></div>
    </section>

    <section class="meme-gallery" aria-label="Meme gallery">
      <div id="memeGrid" class="meme-grid"></div>
    </section>

    <div class="gifbar gifbar-bottom" aria-hidden="true"></div>

    <div id="memeModal" class="meme-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Meme viewer">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close meme viewer">×</button>
      <button id="modalPrev" class="modal-arrow modal-prev" type="button" aria-label="Previous meme">‹</button>
      <div class="modal-frame">
        <img id="modalImage" src="" alt="">
        <div id="modalCounter" class="modal-counter"></div>
      </div>
      <button id="modalNext" class="modal-arrow modal-next" type="button" aria-label="Next meme">›</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
